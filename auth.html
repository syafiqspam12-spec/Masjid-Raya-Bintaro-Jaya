<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Masuk / Daftar - Masjid Raya Bintaro Jaya</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      "primary":"#00342b","on-primary":"#ffffff","primary-container":"#004d40",
      "surface":"#f8faf8","surface-container":"#eceeec","surface-container-lowest":"#ffffff",
      "on-surface":"#191c1b","on-surface-variant":"#3f4945","outline-variant":"#bfc9c4",
      "error":"#ba1a1a","secondary-container":"#fed488","primary-fixed":"#afefdd"
    }}}
  }
</script>
<style>
  body { font-family: 'Manrope', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center px-4 py-10">

<div class="w-full max-w-md">
  <!-- Loading -->
  <div id="auth-loading" class="flex flex-col items-center gap-3 py-12 text-on-surface-variant">
    <span class="material-symbols-outlined text-4xl animate-spin">progress_activity</span>
    <p class="text-sm">Menghubungkan ke server...</p>
  </div>

  <!-- Logo & Brand -->
  <div id="auth-brand" class="hidden flex-col items-center mb-8">
    <img src="logomasjid.jpg" alt="Logo" class="h-16 w-16 object-contain rounded-full border border-gray-200 mb-3 shadow-sm"/>
    <h1 class="text-xl font-bold text-primary">Masjid Raya Bintaro Jaya</h1>
    <p class="text-sm text-on-surface-variant mt-1">Komunitas Digital Masjid</p>
  </div>

  <!-- Card -->
  <div id="auth-card" class="hidden bg-white rounded-2xl shadow-xl overflow-hidden">
    <!-- Tab -->
    <div class="flex border-b border-gray-100">
      <button id="tab-login" onclick="switchTab('login')"
        class="flex-1 py-4 text-sm font-bold text-primary border-b-2 border-primary transition-colors">
        Masuk
      </button>
      <button id="tab-register" onclick="switchTab('register')"
        class="flex-1 py-4 text-sm font-bold text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-colors">
        Daftar
      </button>
    </div>

    <!-- Form Login -->
    <div id="form-login" class="p-6 flex flex-col gap-4">
      <div>
        <label class="text-xs font-semibold text-on-surface-variant block mb-1">Email</label>
        <input id="login-email" type="email" placeholder="email@contoh.com" autocomplete="email"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary transition-colors"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-on-surface-variant block mb-1">Password</label>
        <div class="relative">
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary transition-colors pr-11"/>
          <button type="button" onclick="togglePass('login-password', 'eye-login')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary">
            <span class="material-symbols-outlined text-lg" id="eye-login">visibility</span>
          </button>
        </div>
      </div>
      <p id="login-error" class="text-error text-xs hidden"></p>
      <button onclick="doLogin()"
        class="w-full bg-primary text-white py-3 rounded-xl font-bold text-sm hover:bg-primary-container transition-colors flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-base">login</span>
        <span id="login-btn-label">Masuk</span>
      </button>
      <p class="text-center text-xs text-on-surface-variant">
        Belum punya akun?
        <button onclick="switchTab('register')" class="text-primary font-semibold hover:underline">Daftar sekarang</button>
      </p>
    </div>

    <!-- Form Register -->
    <div id="form-register" class="p-6 flex flex-col gap-4 hidden">
      <div>
        <label class="text-xs font-semibold text-on-surface-variant block mb-1">Nama Lengkap</label>
        <input id="reg-nama" type="text" placeholder="Nama lengkap Anda" autocomplete="name"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary transition-colors"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-on-surface-variant block mb-1">Email</label>
        <input id="reg-email" type="email" placeholder="email@contoh.com" autocomplete="email"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary transition-colors"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-on-surface-variant block mb-1">Password</label>
        <div class="relative">
          <input id="reg-password" type="password" placeholder="Min. 8 karakter" autocomplete="new-password"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary transition-colors pr-11"/>
          <button type="button" onclick="togglePass('reg-password', 'eye-reg')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary">
            <span class="material-symbols-outlined text-lg" id="eye-reg">visibility</span>
          </button>
        </div>
        <!-- Password strength -->
        <div class="mt-2 flex gap-1">
          <div class="h-1 flex-1 rounded-full bg-gray-200" id="str-1"></div>
          <div class="h-1 flex-1 rounded-full bg-gray-200" id="str-2"></div>
          <div class="h-1 flex-1 rounded-full bg-gray-200" id="str-3"></div>
          <div class="h-1 flex-1 rounded-full bg-gray-200" id="str-4"></div>
        </div>
        <p class="text-xs text-on-surface-variant mt-1" id="str-label"></p>
      </div>
      <p id="reg-error" class="text-error text-xs hidden"></p>
      <p id="reg-success" class="text-emerald-700 text-xs hidden bg-emerald-50 rounded-xl p-3"></p>
      <button onclick="doRegister()"
        class="w-full bg-primary text-white py-3 rounded-xl font-bold text-sm hover:bg-primary-container transition-colors flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-base">person_add</span>
        <span id="reg-btn-label">Buat Akun</span>
      </button>
      <p class="text-center text-xs text-on-surface-variant">
        Sudah punya akun?
        <button onclick="switchTab('login')" class="text-primary font-semibold hover:underline">Masuk di sini</button>
      </p>
    </div>
  </div>

  <p class="text-center text-xs text-on-surface-variant mt-6">
    <a href="home.html" class="hover:underline text-primary">← Kembali ke Beranda</a>
  </p>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

let supabase = null;

async function initSupabase() {
  try {
    const res = await fetch('/.netlify/functions/get-supabase-config');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data?.url || !data?.anonKey) throw new Error('Config kosong');
    supabase = createClient(data.url, data.anonKey);
    return true;
  } catch(e) {
    console.error('initSupabase error:', e);
    return false;
  }
}

async function main() {
  const ok = await initSupabase();
  if (!ok) {
    document.getElementById('auth-loading').innerHTML = `
      <p class="text-error font-semibold">Gagal terhubung ke server.</p>
      <p class="text-sm text-on-surface-variant mt-1">Pastikan Anda membuka dari URL Netlify.</p>
      <a href="home.html" class="text-primary text-sm mt-3 inline-block hover:underline">← Kembali ke Beranda</a>`;
    return;
  }

  // Cek jika sudah login, redirect
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const redirect = new URLSearchParams(window.location.search).get('redirect') || 'home.html';
      window.location.href = redirect;
      return;
    }
  } catch(e) { console.error('getSession error:', e); }

  // Tampilkan form
  document.getElementById('auth-loading').classList.add('hidden');
  document.getElementById('auth-brand').classList.remove('hidden');
  document.getElementById('auth-brand').classList.add('flex');
  document.getElementById('auth-card').classList.remove('hidden');
}

window.switchTab = function(tab) {
  const isLogin = tab === 'login';
  document.getElementById('form-login').classList.toggle('hidden', !isLogin);
  document.getElementById('form-register').classList.toggle('hidden', isLogin);
  document.getElementById('tab-login').className = isLogin
    ? 'flex-1 py-4 text-sm font-bold text-primary border-b-2 border-primary transition-colors'
    : 'flex-1 py-4 text-sm font-bold text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-colors';
  document.getElementById('tab-register').className = !isLogin
    ? 'flex-1 py-4 text-sm font-bold text-primary border-b-2 border-primary transition-colors'
    : 'flex-1 py-4 text-sm font-bold text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-colors';
};

window.togglePass = function(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text'; icon.textContent = 'visibility_off';
  } else {
    input.type = 'password'; icon.textContent = 'visibility';
  }
};

// Password strength
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('reg-password')?.addEventListener('input', function() {
    const val = this.value;
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['bg-red-400','bg-orange-400','bg-yellow-400','bg-emerald-500'];
    const labels = ['','Lemah','Sedang','Kuat','Sangat Kuat'];
    for (let i = 1; i <= 4; i++) {
      const el = document.getElementById('str-' + i);
      if (el) el.className = 'h-1 flex-1 rounded-full ' + (i <= score ? colors[score-1] : 'bg-gray-200');
    }
    const lbl = document.getElementById('str-label');
    if (lbl) lbl.textContent = labels[score] || '';
  });

  document.getElementById('login-password')?.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('reg-password')?.addEventListener('keydown', e => { if(e.key==='Enter') doRegister(); });
});

window.doLogin = async function() {
  if (!supabase) { alert('Koneksi server belum siap. Coba refresh.'); return; }
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.querySelector('#form-login button[onclick="doLogin()"]');
  const btnLabel = document.getElementById('login-btn-label');
  errEl.classList.add('hidden');

  if (!email || !password) { errEl.textContent = 'Email dan password wajib diisi.'; errEl.classList.remove('hidden'); return; }

  btnLabel.textContent = 'Memproses...';
  btn.disabled = true;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errEl.textContent = error.message.includes('Invalid') ? 'Email atau password salah.' : error.message;
    errEl.classList.remove('hidden');
    btnLabel.textContent = 'Masuk';
    btn.disabled = false;
  } else {
    btnLabel.textContent = 'Berhasil!';
    const redirect = new URLSearchParams(window.location.search).get('redirect') || 'home.html';
    window.location.href = redirect;
  }
};

window.doRegister = async function() {
  if (!supabase) { alert('Koneksi server belum siap. Coba refresh.'); return; }
  const nama = document.getElementById('reg-nama').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('reg-error');
  const sucEl = document.getElementById('reg-success');
  const btn = document.querySelector('#form-register button[onclick="doRegister()"]');
  const btnLabel = document.getElementById('reg-btn-label');
  errEl.classList.add('hidden'); sucEl.classList.add('hidden');

  if (!nama) { errEl.textContent = 'Nama lengkap wajib diisi.'; errEl.classList.remove('hidden'); return; }
  if (!email) { errEl.textContent = 'Email wajib diisi.'; errEl.classList.remove('hidden'); return; }
  if (password.length < 8) { errEl.textContent = 'Password minimal 8 karakter.'; errEl.classList.remove('hidden'); return; }

  btnLabel.textContent = 'Memproses...';
  btn.disabled = true;

  const { data, error } = await supabase.auth.signUp({
    email, password,
    options: { data: { full_name: nama } }
  });

  if (error) {
    errEl.textContent = error.message.includes('already') ? 'Email sudah terdaftar. Silakan masuk.' : error.message;
    errEl.classList.remove('hidden');
    btnLabel.textContent = 'Buat Akun';
    btn.disabled = false;
  } else if (data.session) {
    btnLabel.textContent = 'Berhasil!';
    const redirect = new URLSearchParams(window.location.search).get('redirect') || 'home.html';
    window.location.href = redirect;
  } else {
    sucEl.textContent = '✅ Akun berhasil dibuat! Cek email Anda untuk konfirmasi, lalu masuk.';
    sucEl.classList.remove('hidden');
    btnLabel.textContent = 'Buat Akun';
    btn.disabled = false;
    setTimeout(() => switchTab('login'), 3000);
  }
};

main();
</script>
</body>
</html>
