<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Donasi Berhasil - Masjid Raya Bintaro Jaya</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>body{font-family:'Manrope',sans-serif;}</style>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full text-center">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="#16a34a" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-green-700 mb-2">Jazakallahu Khairan!</h1>
    <p class="text-gray-600 mb-1">Donasi Anda telah berhasil.</p>
    <p class="text-gray-500 text-sm mb-6" id="order-info"></p>
    <p class="text-gray-500 text-sm mb-6">Semoga Allah menerima amal kebaikan Anda dan melipatgandakan pahalanya. Aamiin.</p>
    <a href="service.html" class="block w-full bg-green-700 text-white py-3 rounded-xl font-semibold hover:bg-green-800 transition-colors mb-3">
      Kembali ke Layanan
    </a>
    <a href="home.html" class="block w-full border border-gray-200 text-gray-600 py-3 rounded-xl font-semibold hover:bg-gray-50 transition-colors">
      Ke Beranda
    </a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    if (orderId) {
      document.getElementById('order-info').textContent = 'ID Transaksi: ' + orderId;
    }
  </script>
</body>
</html>
